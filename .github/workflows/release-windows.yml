name: Release Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Validate release version and tag
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$pkg.version
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "package.json version '$version' is not a valid release version"
          }
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git tag '$env:GITHUB_REF_NAME' does not match package.json version '$version'. Expected '$expectedTag'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$expectedTag" >> $env:GITHUB_OUTPUT

      - name: Build frontend
        run: npm run build:frontend

      - name: Build Windows NSIS installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Generate update manifest
        run: npm run generate:update-manifest

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "release/BanHangOffline-Setup-v$version.exe"
          $blockmap = "$installer.blockmap"
          $latest = 'release/latest.yml'
          $manifest = 'release/update-manifest.json'
          foreach ($file in @($installer, $blockmap, $latest, $manifest)) {
            if (-not (Test-Path $file)) {
              throw "Missing release artifact: $file"
            }
          }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          Get-Content $latest
          Get-Content $manifest

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BanHangOffline ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/BanHangOffline-Setup-v${{ steps.version.outputs.version }}.exe
            release/BanHangOffline-Setup-v${{ steps.version.outputs.version }}.exe.blockmap
            release/latest.yml
            release/update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
