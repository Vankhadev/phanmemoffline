name: Release Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Backend database smoke check
        run: |
          node -e "const db = require('./backend/src/db/database'); const required = ['loadDB','saveDB','insert','update','remove','getAll','getOne','getSyncVersions','runWithRequestContext']; for (const key of required) { if (typeof db[key] !== 'function') throw new Error('Missing database export: ' + key); } console.log('Backend database exports OK');"

      - name: Validate release version and tag
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$pkg.version
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "package.json version '$version' is not a valid release version"
          }
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git tag '$env:GITHUB_REF_NAME' does not match package.json version '$version'. Expected '$expectedTag'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$expectedTag" >> $env:GITHUB_OUTPUT

      - name: Build frontend
        run: npm run build:frontend

      - name: Build Windows NSIS installers x64 and ia32
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:installer

      - name: Generate updater metadata
        run: |
          npm run generate:latest-yml
          npm run generate:update-manifest

      - name: Verify local release artifacts
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-windows-release.ps1 -Mode local -Version '${{ steps.version.outputs.version }}' -Tag '${{ steps.version.outputs.tag }}' -Arch x64,ia32

      - name: Verify app-update.yml provider
        shell: pwsh
        run: |
          $appUpdate = 'release/win-unpacked/resources/app-update.yml'
          if (-not (Test-Path $appUpdate)) {
            throw "Missing release artifact: $appUpdate"
          }
          $appUpdateContent = Get-Content $appUpdate -Raw
          if ($appUpdateContent -notmatch "(?m)^provider:\s*generic\s*$") {
            throw "app-update.yml must use provider generic to avoid GitHub releases.atom checks"
          }
          if ($appUpdateContent -notmatch "https://github\.com/Vankhadev/phanmemoffline/releases/latest/download/") {
            throw "app-update.yml does not point to the public latest.yml base URL"
          }
          if ($appUpdateContent -match "releases\.atom") {
            throw "app-update.yml must not reference releases.atom"
          }
          Get-Content $appUpdate

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BanHangOffline ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          make_latest: true
          files: |
            release/banhangoffline-setup-v${{ steps.version.outputs.version }}-x64.exe
            release/banhangoffline-setup-v${{ steps.version.outputs.version }}-x64.exe.blockmap
            release/banhangoffline-setup-v${{ steps.version.outputs.version }}-ia32.exe
            release/banhangoffline-setup-v${{ steps.version.outputs.version }}-ia32.exe.blockmap
            release/latest.yml
            release/update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify anonymous updater and installer access
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-windows-release.ps1 -Mode remote -Version '${{ steps.version.outputs.version }}' -Tag '${{ steps.version.outputs.tag }}' -Arch x64,ia32
